<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My ToDo</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <div class="topbar">
        <h1>My ToDo</h1>
        <button
          id="theme-toggle"
          class="theme-toggle"
          type="button"
          aria-label="ダークモードに切り替える"
        >
          <span class="theme-icon" aria-hidden="true">🌙</span>
        </button>
      </div>

      <form id="todo-form" class="todo-form">
        <input
          id="todo-input"
          type="text"
          placeholder="やることを入力"
          aria-label="ToDoの入力"
          maxlength="100"
        />
        <button type="submit">追加</button>
      </form>

      <div class="todo-summary" aria-live="polite">
        <span class="todo-count-label">未完了</span>
        <span id="todo-count" class="todo-count">0</span>
      </div>

      <div class="todo-filters" role="group" aria-label="タスクの絞り込み">
        <button type="button" class="todo-filter-btn" data-filter="all" aria-pressed="true">すべて</button>
        <button type="button" class="todo-filter-btn" data-filter="active" aria-pressed="false">未完了</button>
        <button type="button" class="todo-filter-btn" data-filter="completed" aria-pressed="false">完了</button>
      </div>
      <p id="todo-status" class="todo-status" aria-live="polite"></p>

      <button
        id="clear-completed-btn"
        class="clear-completed-btn"
        type="button"
        aria-label="完了済みのタスクを削除"
      >
        完了済みのタスクを一括削除
      </button>

      <ul id="todo-list" class="todo-list" aria-live="polite"></ul>
    </div>

    <script src="script.js"></script>
  </body>
</html>
